server {
    listen 80;
    server_name localhost;

    # 1. Angular Portal on /
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. Assignment 1: Customer Churn Flask API & UI on /assignment-1/
    location /assignment-1/ {
        proxy_pass http://churn-app:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Assignment 2: Streamlit Travel Assistant on /assignment-2/
    location ^~ /assignment-2/ {
        proxy_pass http://travel-assistant:8501/assignment-2/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}
